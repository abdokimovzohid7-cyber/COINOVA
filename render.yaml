services:
  - type: web
    name: coinova-web
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build && npm run db:migrate -w server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_ORIGIN
        sync: false
      - key: VITE_BOT_USERNAME
        sync: false
